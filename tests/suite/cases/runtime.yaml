# Cases: the runtime tier: the subset rule, intrinsics, raw memory, static storage, the clocks.

cases:
  - name: bump-alloc
    fixture: tests/fixtures/bump_alloc
    compile_args:
      - "--runtime-subset=bumpNew,bumpAlloc"
    expect:
      stdout: "42\n99\n1\n1\n"
    carriers: []

  - name: raw-mem
    fixture: tests/fixtures/raw_mem
    expect:
      stdout: "42\n7\n99\n255\n1\n"
    carriers: []
    object_references:
      - pattern: rt_raw_
        max: 0
      - pattern: posix_memalign
        min: 1

  - name: managed-buffer-ref
    fixture: tests/fixtures/managed_buffer_ref
    compile_args:
      - "--allow-core-import"
    compile_settings:
      escape: false
    expect:
      stdout: "111\n222\n"
    carriers: []

  - name: managed-buffer-ref-evac
    fixture: tests/fixtures/managed_buffer_ref
    compile_args:
      - "--allow-core-import"
    compile_settings:
      escape: false
    run_settings:
      gc_stress_bytes: 64
    expect:
      stdout: "111\n222\n"
    carriers: []
    collections:
      - min: 1

  - name: managed-buffer-scalar-ref-bad
    fixture: tests/fixtures/managed_buffer_scalar_ref_bad
    compile_args:
      - "--allow-core-import"
    compile:
      expect_error: "requires a reference Element"
    carriers: []

  - name: sysclock
    fixture: tests/fixtures/sysclock
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "1\n1\n"
    carriers: []

  - name: sysclock-subset
    fixture: tests/fixtures/sysclock
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=elapsed"
    expect:
      stdout: "1\n1\n"
    carriers: []

  - name: subset-ok
    fixture: tests/fixtures/subset_ok
    compile_args:
      - "--runtime-subset=carve,advance"
    expect:
      stdout: "42\n"
    carriers: []

  - name: subset-bad
    fixture: tests/fixtures/subset_bad
    compile_args:
      - "--runtime-subset=bad"
    compile:
      expect_error: "may not allocate a 'Box'"

  - name: subset-bad-call
    fixture: tests/fixtures/subset_bad
    compile_args:
      - "--runtime-subset=bad"
    compile:
      expect_error: "may not call 'helper'"

  - name: subset-poll
    fixture: tests/fixtures/subset_poll
    compile_args:
      - "--runtime-subset=ramp"
    compile_settings:
      inline: false
    expect:
      stdout: "45\n"
    carriers: []
    object_symbols:
      - pattern: __nomu_gc_poll_slow
        max: 0

  - name: static-storage
    fixture: tests/fixtures/static_storage
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "0\n3\n1\n1\n1\n"
    carriers: []

  - name: static-storage-release
    fixture: tests/fixtures/static_storage
    compile_settings:
      runtime_tier: true
      optimize: true
    expect:
      stdout: "0\n3\n1\n1\n1\n"
    carriers: []

  - name: runtime-intrinsic-rejected
    fixture: tests/fixtures/runtime_intrinsic_rejected
    compile:
      expect_error: "undefined name 'Runtime'"

  - name: bundle-rt-prelude
    fixture: tests/fixtures/bundle_rt_prelude
    compile_settings:
      rt_prelude: true
    expect:
      stdout_file: tests/fixtures/bundle_rt_prelude/expected.txt
    carriers: []

  - name: bundle-core-import
    fixture: tests/fixtures/bundle_core_import
    compile_args:
      - "--allow-core-import"
    expect:
      stdout_file: tests/fixtures/bundle_core_import/expected.txt
    carriers: []

  # The fault handler (task 219): a crash prints the report, then the signal's default action ends the run.
  # Each crash also leaves a system crash report in ~/Library/Logs/DiagnosticReports.
  - name: crash-segv
    fixture: tests/fixtures/crash_segv
    expect:
      signal: SIGSEGV
    stderr_match:
      - pattern: "nomu-crash: format 1"
        min: 1
        max: 1
      - pattern: "nomu-crash: signal: SIGSEGV (11)"
        min: 1
      - pattern: "nomu-crash: address: 0x0000000000000010"
        min: 1
      - pattern: "nomu-crash: thread: "
        min: 1
      - pattern: "nomu-crash: image: "
        min: 1
      - pattern: "nomu-crash: registers: pc "
        min: 1
      - pattern: "nomu-crash: frame "
        min: 3
      - pattern: "nomu-crash: gc: "
        max: 0
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []

  # SIGTRAP and SIGILL: Darwin keeps their handler through SA_RESETHAND, so the handler restores the default
  # action before it re-raises; one report, then the signal ends the run (task 264).
  - name: crash-sigtrap
    fixture: tests/fixtures/crash_sigtrap
    compile_settings:
      runtime_tier: true
    timeout_sec: 5
    expect:
      signal: SIGTRAP
    stderr_match:
      - pattern: "nomu-crash: format 1"
        min: 1
        max: 1
      - pattern: "nomu-crash: signal: SIGTRAP (5)"
        min: 1
        max: 1
      - pattern: "nomu-crash: end"
        min: 1
        max: 1
    carriers: []

  - name: crash-sigill
    fixture: tests/fixtures/crash_sigill
    compile_settings:
      runtime_tier: true
    timeout_sec: 5
    expect:
      signal: SIGILL
    stderr_match:
      - pattern: "nomu-crash: format 1"
        min: 1
        max: 1
      - pattern: "nomu-crash: signal: SIGILL (4)"
        min: 1
        max: 1
      - pattern: "nomu-crash: end"
        min: 1
        max: 1
    carriers: []

  # A function the optimizer reduces to a trap keeps no stack check, and needs none (task 264).
  - name: trap-only-function
    fixture: tests/fixtures/trap_only_function
    compile_settings:
      optimize: true
    expect:
      stdout: "ok\n"
    carriers: []

  - name: crash-bounds
    fixture: tests/fixtures/crash_bounds
    expect:
      signal: SIGABRT
    stderr_match:
      - pattern: "fatal error: array index 7 out of range for length 3"
        min: 1
      - pattern: "nomu-crash: signal: SIGABRT (6)"
        min: 1
      - pattern: "nomu-crash: address: "
        max: 0
      - pattern: "nomu-crash: frame "
        min: 3
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []

  # Unbounded recursion: the stack grows to its maximum size (1 MiB here), then the function-entry stack
  # check stops it with the overflow error before it writes past its fiber's stack (task 104).
  - name: stack-overflow
    fixture: tests/fixtures/stack_overflow
    run_settings:
      stack_max: 1048576
    expect:
      stdout: "100\n"
      signal: SIGABRT
    stderr_match:
      - pattern: "nomu: stack overflow: a fiber's stack reached its maximum size"
        min: 1
    carriers: []

  # Nomu's own memory routines (the asm floor's `memcpy`, `memmove`, `memset`, `bzero`, `memcmp`): every size
  # to 300 at each alignment, larger sizes through libSystem's routines, overlapping copies (task 104).
  - name: memory-routines
    fixture: tests/fixtures/memory_routines
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "bad 0\n"
    carriers: []

  - name: memory-routines-release
    fixture: tests/fixtures/memory_routines
    compile_settings:
      rt_prelude: true
      optimize: true
    expect:
      stdout: "bad 0\n"
    carriers: []

  # A detached fiber: arguments evaluated at the statement, the result dropped, a method call, a fiber started
  # under an `if` in a loop (task 250).
  - name: fiber-detached
    fixture: tests/fixtures/fiber_detached
    carriers:
      - 1
    expect:
      stdout: "1\nevaluated\nstarted\n7\n42\n101\ndone\n"

  # `main` returning ends the program with fibers spinning, allocating and sleeping.
  - name: fiber-exit-running
    fixture: tests/fixtures/fiber_exit_running
    carriers:
      - 4
    iterations: 5
    expect:
      stdout: "main done\n"

  # More sleepers than the timer heap's first capacity.
  - name: fiber-many-sleepers
    fixture: tests/fixtures/fiber_many_sleepers
    expect:
      stdout: "ok\n"

  - name: fiber-not-call
    fixture: tests/fixtures/fiber_not_call
    compile:
      expect_error: "'fiber' takes a call"

  - name: fiber-not-shareable
    fixture: tests/fixtures/fiber_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so it cannot be passed to a 'fiber'"

  # Frames larger than the stack reserve holds: each such function is split into a wrapper that checks for its
  # frame and an unchecked body, and stacks grow from 2 KiB through the wrappers' checks (task 104).
  - name: large-frame
    fixture: tests/fixtures/large_frame
    expect:
      stdout: "13\n53\n203\n403\n"

  # Release, with a stack move at every check: a `mutating` receiver held across a call (a frame address the
  # tracking pass must record from the function's entry, wherever the optimizer moved its marker).
  - name: large-frame-release-moving
    fixture: tests/fixtures/large_frame
    compile_settings:
      optimize: true
    run_settings:
      stack_move_checks: 1
    expect:
      stdout: "13\n53\n203\n403\n"

  # Deep recursion on several fibers at once, from the default (smallest) starting size: each stack grows by
  # moving while its frames hold managed objects (task 104).
  - name: stack-growth
    fixture: tests/fixtures/stack_growth
    expect:
      stdout: "1250025000\n5000050000\n20000100000\n45000150000\n"

  # The stack counters (task 104): the same growth, with its moves counted and printed at exit.
  - name: stack-stats
    fixture: tests/fixtures/stack_growth
    run_settings:
      stack_stats: 1
    expect:
      stdout: "1250025000\n5000050000\n20000100000\n45000150000\n"
    stderr_match:
      - pattern: "nomu-stacks: moves="
        min: 1
        max: 1
      - pattern: " grown=0 "
        max: 0

  # Stacks shrink at a major collection: fibers that grew and then sleep shallow come back smaller,
  # their frames' objects intact (task 104).
  - name: stack-shrink
    fixture: tests/fixtures/stack_shrink
    compile_settings:
      escape: false
      rt_prelude: true
    expect:
      stdout: "200010000\n800020000\n3200040000\n"
    carriers:
      - 1
      - 4

  # The same with fibers parked in channel operations, whose waiters the channel's queues point at: three
  # receivers on one channel, two senders on another, and a task join (task 104).
  - name: stack-shrink-chan
    fixture: tests/fixtures/stack_shrink_chan
    compile_settings:
      escape: false
      rt_prelude: true
    expect:
      stdout: "1450045006\n200010000\n800020000\n16\n450015005\n"
    carriers:
      - 1
      - 4

  # The collector's recorder reports through the handler when `gc.record` is on.
  - name: crash-gc-record
    fixture: tests/fixtures/crash_segv
    compile_settings:
      gc_record: true
    expect:
      signal: SIGSEGV
    stderr_match:
      - pattern: "nomu-crash: gc: between cycles, 0 completed"
        min: 1
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []

  # Channels (task 102): the runtime core under the prelude's `Channel<T>`. The stack-move matrix runs
  # `channel_values` compiled once across the collectors; `channel_local` declares its own channel type, so its
  # methods are specialized. These run both on several carriers and check the faults.
  - name: channel-values-carriers
    fixture: tests/fixtures/stack_move_matrix/channel_values
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "bad 0\n"
    carriers:
      - 4

  # Stop-the-world under a mixed load (task 235.6): fibers, channels and actors moving managed values on every
  # carrier count while collections run, every 4 KiB a carrier allocates, at each minor collection, and with
  # stacks moved at every resume.
  - name: sched-mixed-load
    fixture: tests/fixtures/sched_mixed_load
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "bad 0\n"
    carriers:
      - 1
      - 2
      - 4
      - 8
    iterations: 2
    full_iterations: 10
    collections:
      - min: 1

  # Optimized: the vectorizer loads two references as one vector, and every lane must be rooted
  # (`nomu-split-reference-aggregates`). A relay's channel went unrooted and stale here before.
  - name: sched-mixed-load-release
    fixture: tests/fixtures/sched_mixed_load
    compile_settings:
      optimize: true
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "bad 0\n"
    carriers:
      - 1
      - 4
      - 6
      - 8
    iterations: 3
    full_iterations: 10
    collections:
      - min: 1

  - name: sched-mixed-load-nursery
    fixture: tests/fixtures/sched_mixed_load
    run_settings:
      nursery_blocks: 16
    expect:
      stdout: "bad 0\n"
    carriers:
      - 1
      - 2
      - 4
      - 8
    iterations: 2
    full_iterations: 10
    collections:
      - kind: minor
        min: 1

  - name: sched-mixed-load-stack-move
    fixture: tests/fixtures/sched_mixed_load
    run_settings:
      gc_stress_bytes: 65536
      stack_move: 1
    expect:
      stdout: "bad 0\n"
    carriers:
      - 1
      - 2
      - 4
      - 8
    iterations: 2
    full_iterations: 10
    collections:
      - min: 1

  - name: channel-local
    fixture: tests/fixtures/channel_local
    compile_args:
      - "--allow-core-import"
    run_settings:
      gc_stress_bytes: 4096
      stack_move: 1
    expect:
      stdout: "bad 0\n"
    collections:
      - min: 100

  - name: channel-local-release
    fixture: tests/fixtures/channel_local
    compile_args:
      - "--allow-core-import"
    compile_settings:
      optimize: true
    run_settings:
      gc_stress_bytes: 4096
      stack_move_checks: 1
    expect:
      stdout: "bad 0\n"
    collections:
      - min: 100

  - name: channel-local-carriers
    fixture: tests/fixtures/channel_local
    compile_args:
      - "--allow-core-import"
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "bad 0\n"
    carriers:
      - 4

  # A mailbox fiber parked on a channel inside a handler: its carrier keeps the old lock order.
  - name: channel-actor
    fixture: tests/fixtures/channel_actor
    expect:
      stdout: "bad 0\n"
    carriers:
      - 1
      - 4

  # `Task<T>` from the stdlib, before the `task` keyword: one result stored once and read by repeated joins,
  # by joins parked before it is stored, and by joins after; a managed result across collections; fan-out.
  - name: task-library
    fixture: tests/fixtures/task_library
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "repeat 49 49\nwaiters 648 0\nlate 25 0\nmanaged 4 42\nfanout 328350 0\n"
    carriers:
      - 1
      - 4
    iterations: 2
    full_iterations: 10
    collections:
      - min: 1

  - name: task-library-nursery
    fixture: tests/fixtures/task_library
    run_settings:
      nursery_blocks: 16
    expect:
      stdout: "repeat 49 49\nwaiters 648 0\nlate 25 0\nmanaged 4 42\nfanout 328350 0\n"
    carriers:
      - 1
      - 4
    collections:
      - kind: minor
        min: 1

  - name: task-library-stack-move
    fixture: tests/fixtures/task_library
    run_settings:
      gc_stress_bytes: 65536
      stack_move: 1
    expect:
      stdout: "repeat 49 49\nwaiters 648 0\nlate 25 0\nmanaged 4 42\nfanout 328350 0\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  # `task f(x)`: arguments evaluated at the site, repeated joins, joins from several fibers, a void task, a managed
  # result across collections, a task returned from its starter, fan-out over an array, and tasks inside tasks.
  - name: task-keyword
    fixture: tests/fixtures/task_keyword
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "repeat 49 49\neager 9 100\nmethod 42 0\nvoid 11 0\njoiners 648 81\nmanaged 42 48\nreturned 42 0\nfanout 328350 0\ntree 127 0\n"
    carriers:
      - 1
      - 4
    iterations: 2
    full_iterations: 10
    collections:
      - min: 1

  - name: task-keyword-nursery
    fixture: tests/fixtures/task_keyword
    run_settings:
      nursery_blocks: 16
    expect:
      stdout: "repeat 49 49\neager 9 100\nmethod 42 0\nvoid 11 0\njoiners 648 81\nmanaged 42 48\nreturned 42 0\nfanout 328350 0\ntree 127 0\n"
    carriers:
      - 1
      - 4
    collections:
      - kind: minor
        min: 1

  - name: task-keyword-stack-move
    fixture: tests/fixtures/task_keyword
    run_settings:
      gc_stress_bytes: 65536
      stack_move: 1
    expect:
      stdout: "repeat 49 49\neager 9 100\nmethod 42 0\nvoid 11 0\njoiners 648 81\nmanaged 42 48\nreturned 42 0\nfanout 328350 0\ntree 127 0\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  # `task` inside generic functions specialized per use. A compiled-once generic body cannot start a fiber yet.
  - name: task-generic
    fixture: tests/fixtures/task_generic
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "42\n7 seven\neight\n3\n"
    carriers:
      - 1
      - 4

  - name: task-not-call
    fixture: tests/fixtures/task_not_call
    compile:
      expect_error: "'task' takes a call"

  - name: task-not-shareable
    fixture: tests/fixtures/task_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so it cannot be passed to a 'task'"

  # An actor message crosses a task boundary, so its arguments must be shareable, as a 'task''s are.
  - name: actor-not-shareable
    fixture: tests/fixtures/actor_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so it cannot be passed to actor handler 'take'"

  - name: actor-conformer-result
    fixture: tests/fixtures/actor_conformer_result
    compile:
      expect_error: "actor 'Server' cannot conform to 'Pingable': method 'ping' returns a value, and a handler returns none"

  - name: actor-conformer-property
    fixture: tests/fixtures/actor_conformer_property
    compile:
      expect_error: "actor 'Server' cannot conform to 'Sized': property 'size' needs a value from the actor"

  - name: actor-conformer-default
    fixture: tests/fixtures/actor_conformer_default
    compile:
      expect_error: "missing handler 'done'; an actor implements each requirement as a handler, so it does not inherit the default"

  - name: actor-conformer-not-shareable
    fixture: tests/fixtures/actor_conformer_not_shareable
    compile:
      expect_error: "parameter 'b' of 'take' has type 'Box', which is not shareable, so it cannot be sent to an actor"

  - name: actor-conformer-signature
    fixture: tests/fixtures/actor_conformer_signature
    compile:
      expect_error: "type 'Counter' does not conform to 'Sink': handler 'put' has the wrong signature"

  - name: actor-not-shareable-struct
    fixture: tests/fixtures/actor_not_shareable_struct
    compile:
      expect_error: "type 'Holder' is not shareable, so it cannot be passed to actor handler 'take'"

  - name: actor-construct-not-shareable
    fixture: tests/fixtures/actor_construct_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so it cannot be passed to actor 'Sink'"

  # A message cut on one carrier and freed on another: the pool hands slots back through its global stacks,
  # so 150 rounds of 20,000 items through 8 stages hold about one round's messages: 17 MiB resident on 4
  # carriers, against 34 MiB with no hand-back.
  - name: actor-pool-bounded
    fixture: tests/fixtures/actor_pool_bounded
    expect:
      stdout: "bad 0\n"
      max_resident_mib: 24
    carriers:
      - 4

  # Minors scan only the messages sent since the last collection, from each carrier's young list; on several
  # carriers one carrier drops a freed slot from its list while another sends in it. Stress collections with
  # the heap verifier, so a message a minor missed shows as a dangling reference.
  - name: actor-pool-carriers
    fixture: tests/fixtures/actor_pool_matrix/pipeline
    compile_settings:
      escape: false
    run_settings:
      gc_stress_bytes: 4096
      gc_verify: 1
    expect:
      stdout: "bad 0\n"
    carriers:
      - 2
      - 4
    iterations: 3
    collections:
      - min: 50

  - name: actor-shareable-args
    fixture: tests/fixtures/actor_shareable_args
    expect:
      stdout: "lc\n35\n"

  - name: task-result-not-shareable
    fixture: tests/fixtures/task_result_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so a 'task' cannot return it"

  - name: task-unused
    fixture: tests/fixtures/task_unused
    compile:
      expect_error: "the result of 'task' is unused; use 'fiber' to start a fiber with no result"

  - name: select-basic
    fixture: tests/fixtures/select_basic
    expect:
      stdout: "ready 7\ndefault 1\nsent 5\ngot 5\nclosed 0\nwoke 42\ndrained 4950\n"
    carriers:
      - 1
      - 4
    iterations: 2
    full_iterations: 10

  - name: select-basic-stack-move
    fixture: tests/fixtures/select_basic
    run_settings:
      stack_move: 1
    expect:
      stdout: "ready 7\ndefault 1\nsent 5\ngot 5\nclosed 0\nwoke 42\ndrained 4950\n"
    carriers:
      - 1
      - 4

  - name: select-stress
    fixture: tests/fixtures/select_stress
    run_settings:
      gc_stress_bytes: 65536
    expect:
      stdout: "fan-in 7998000 0\nping-pong 3998000 0\nfair 1 2000\n"
    carriers:
      - 1
      - 4
    iterations: 2
    full_iterations: 10
    collections:
      - min: 1

  - name: select-stress-nursery
    fixture: tests/fixtures/select_stress
    run_settings:
      nursery_blocks: 16
    expect:
      stdout: "fan-in 7998000 0\nping-pong 3998000 0\nfair 1 2000\n"
    carriers:
      - 1
      - 4
    collections:
      - kind: minor
        min: 1

  - name: select-stress-stack-move
    fixture: tests/fixtures/select_stress
    run_settings:
      gc_stress_bytes: 65536
      stack_move: 1
    expect:
      stdout: "fan-in 7998000 0\nping-pong 3998000 0\nfair 1 2000\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  - name: select-generic
    fixture: tests/fixtures/select_generic
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "specialized 3\nerased 4\nclosed none\nerased managed 9 late\nerased two cases 10 late\nspecialized managed 8 late\noffer 1 0\noffered\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  - name: select-generic-stack-move
    fixture: tests/fixtures/select_generic
    run_settings:
      gc_stress_bytes: 65536
      stack_move: 1
    expect:
      stdout: "specialized 3\nerased 4\nclosed none\nerased managed 9 late\nerased two cases 10 late\nspecialized managed 8 late\noffer 1 0\noffered\n"
    carriers:
      - 1
      - 4

  - name: select-after
    fixture: tests/fixtures/select_after
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "timeout 5\nvalue 7\nzero 0\nshorter 3\nlost timers 2000\npending 0\nworkers 5050\n"
    carriers:
      - 1
      - 4
    iterations: 2
    full_iterations: 5

  - name: select-after-stack-move
    fixture: tests/fixtures/select_after
    compile_settings:
      rt_prelude: true
    run_settings:
      stack_move: 1
    expect:
