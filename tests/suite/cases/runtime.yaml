# Cases: the runtime tier: the subset rule, intrinsics, raw memory, static storage, the clocks.

cases:
  - name: bump-alloc
    fixture: tests/fixtures/bump_alloc
    compile_args:
      - "--runtime-subset=bumpNew,bumpAlloc"
    expect:
      stdout: "42\n99\n1\n1\n"
    carriers: []

  - name: raw-mem
    fixture: tests/fixtures/raw_mem
    expect:
      stdout: "42\n7\n99\n255\n1\n"
    carriers: []
    object_references:
      - pattern: rt_raw_
        max: 0
      - pattern: posix_memalign
        min: 1

  - name: managed-buffer-ref
    fixture: tests/fixtures/managed_buffer_ref
    compile_args:
      - "--allow-core-import"
    compile_settings:
      escape: false
    expect:
      stdout: "111\n222\n"
    carriers: []

  - name: managed-buffer-ref-evac
    fixture: tests/fixtures/managed_buffer_ref
    compile_args:
      - "--allow-core-import"
    compile_settings:
      escape: false
    run_settings:
      gc_stress_bytes: 64
    expect:
      stdout: "111\n222\n"
    carriers: []
    collections:
      - min: 1

  - name: managed-buffer-scalar-ref-bad
    fixture: tests/fixtures/managed_buffer_scalar_ref_bad
    compile_args:
      - "--allow-core-import"
    compile:
      expect_error: "requires a reference Element"
    carriers: []

  - name: sysclock
    fixture: tests/fixtures/sysclock
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "1\n1\n"
    carriers: []

  - name: sysclock-subset
    fixture: tests/fixtures/sysclock
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=elapsed"
    expect:
      stdout: "1\n1\n"
    carriers: []

  - name: subset-ok
    fixture: tests/fixtures/subset_ok
    compile_args:
      - "--runtime-subset=carve,advance"
    expect:
      stdout: "42\n"
    carriers: []

  - name: subset-bad
    fixture: tests/fixtures/subset_bad
    compile_args:
      - "--runtime-subset=bad"
    compile:
      expect_error: "may not allocate a 'Box'"

  - name: subset-bad-call
    fixture: tests/fixtures/subset_bad
    compile_args:
      - "--runtime-subset=bad"
    compile:
      expect_error: "may not call 'helper'"

  - name: subset-poll
    fixture: tests/fixtures/subset_poll
    compile_args:
      - "--runtime-subset=ramp"
    compile_settings:
      inline: false
    expect:
      stdout: "45\n"
    carriers: []
    object_symbols:
      - pattern: __nomu_gc_poll_slow
        max: 0

  - name: static-storage
    fixture: tests/fixtures/static_storage
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "0\n3\n1\n1\n1\n"
    carriers: []

  - name: static-storage-release
    fixture: tests/fixtures/static_storage
    compile_settings:
      runtime_tier: true
      optimize: true
    expect:
      stdout: "0\n3\n1\n1\n1\n"
    carriers: []

  - name: runtime-intrinsic-rejected
    fixture: tests/fixtures/runtime_intrinsic_rejected
    compile:
      expect_error: "undefined name 'Runtime'"

  - name: bundle-rt-prelude
    fixture: tests/fixtures/bundle_rt_prelude
    compile_settings:
      rt_prelude: true
    expect:
      stdout_file: tests/fixtures/bundle_rt_prelude/expected.txt
    carriers: []

  - name: bundle-core-import
    fixture: tests/fixtures/bundle_core_import
    compile_args:
      - "--allow-core-import"
    expect:
      stdout_file: tests/fixtures/bundle_core_import/expected.txt
    carriers: []

  # The fault handler (task 219): a crash prints the report, then the signal's default action ends the run.
  # Each crash also leaves a system crash report in ~/Library/Logs/DiagnosticReports.
  - name: crash-segv
    fixture: tests/fixtures/crash_segv
    expect:
      signal: SIGSEGV
    stderr_match:
      - pattern: "nomu-crash: format 1"
        min: 1
        max: 1
      - pattern: "nomu-crash: signal: SIGSEGV (11)"
        min: 1
      - pattern: "nomu-crash: address: 0x0000000000000010"
        min: 1
      - pattern: "nomu-crash: thread: "
        min: 1
      - pattern: "nomu-crash: image: "
        min: 1
      - pattern: "nomu-crash: registers: pc "
        min: 1
      - pattern: "nomu-crash: frame "
        min: 3
      - pattern: "nomu-crash: gc: "
        max: 0
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []

  - name: crash-bounds
    fixture: tests/fixtures/crash_bounds
    expect:
      signal: SIGABRT
    stderr_match:
      - pattern: "fatal error: array index 7 out of range for length 3"
        min: 1
      - pattern: "nomu-crash: signal: SIGABRT (6)"
        min: 1
      - pattern: "nomu-crash: address: "
        max: 0
      - pattern: "nomu-crash: frame "
        min: 3
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []

  # Unbounded recursion: the stack grows to its maximum size (1 MiB here), then the function-entry stack
  # check stops it with the overflow error before it writes past its fiber's stack (task 104).
  - name: stack-overflow
    fixture: tests/fixtures/stack_overflow
    run_settings:
      stack_max: 1048576
    expect:
      stdout: "100\n"
      signal: SIGABRT
    stderr_match:
      - pattern: "nomu: stack overflow: a fiber's stack reached its maximum size"
        min: 1
    carriers: []

  # Nomu's own memory routines (the asm floor's `memcpy`, `memmove`, `memset`, `bzero`, `memcmp`): every size
  # to 300 at each alignment, larger sizes through libSystem's routines, overlapping copies (task 104).
  - name: memory-routines
    fixture: tests/fixtures/memory_routines
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "bad 0\n"
    carriers: []

  - name: memory-routines-release
    fixture: tests/fixtures/memory_routines
    compile_settings:
      rt_prelude: true
      optimize: true
    expect:
      stdout: "bad 0\n"
    carriers: []

  # A detached fiber: arguments evaluated at the statement, the result dropped, a method call, a fiber started
  # under an `if` in a loop (task 250).
  - name: fiber-detached
    fixture: tests/fixtures/fiber_detached
    carriers:
      - 1
    expect:
      stdout: "1\nevaluated\nstarted\n7\n42\n101\ndone\n"

  # `main` returning ends the program with fibers spinning, allocating and sleeping.
  - name: fiber-exit-running
    fixture: tests/fixtures/fiber_exit_running
    carriers:
      - 4
    iterations: 5
    expect:
      stdout: "main done\n"

  # More sleepers than the timer heap's first capacity.
  - name: fiber-many-sleepers
    fixture: tests/fixtures/fiber_many_sleepers
    expect:
      stdout: "ok\n"

  - name: fiber-not-call
    fixture: tests/fixtures/fiber_not_call
    compile:
      expect_error: "'fiber' takes a call"

  - name: fiber-not-shareable
    fixture: tests/fixtures/fiber_not_shareable
    compile:
      expect_error: "type 'Box' is not shareable, so it cannot be passed to a 'fiber'"

  # Frames larger than the stack reserve holds: each such function is split into a wrapper that checks for its
  # frame and an unchecked body, and stacks grow from 2 KiB through the wrappers' checks (task 104).
  - name: large-frame
    fixture: tests/fixtures/large_frame
    expect:
      stdout: "13\n53\n203\n403\n"

  # Release, with a stack move at every check: a `mutating` receiver held across a call (a frame address the
  # tracking pass must record from the function's entry, wherever the optimizer moved its marker).
  - name: large-frame-release-moving
    fixture: tests/fixtures/large_frame
    compile_settings:
      optimize: true
    run_settings:
      stack_move_checks: 1
    expect:
      stdout: "13\n53\n203\n403\n"

  # Deep recursion on several fibers at once, from the default (smallest) starting size: each stack grows by
  # moving while its frames hold managed objects (task 104).
  - name: stack-growth
    fixture: tests/fixtures/stack_growth
    expect:
      stdout: "1250025000\n5000050000\n20000100000\n45000150000\n"

  # The collector's recorder reports through the handler when `gc.record` is on.
  - name: crash-gc-record
    fixture: tests/fixtures/crash_segv
    compile_settings:
      gc_record: true
    expect:
      signal: SIGSEGV
    stderr_match:
      - pattern: "nomu-crash: gc: between cycles, 0 completed"
        min: 1
      - pattern: "nomu-crash: end"
        min: 1
    carriers: []
