    expect:
      stdout: "40\n"
    carriers: []

  - name: module-generic-bound
    fixture: tests/fixtures/module_generic_bound
    expect:
      stdout: "3\n"
    carriers: []

  - name: module-generic-bound-nonpod
    fixture: tests/fixtures/module_generic_bound_nonpod
    compile_settings:
      escape: false
      rt_prelude: true
    expect:
      stdout: "333\n"
    carriers:
      - 1
      - 2
    iterations: 3
    weight: 2
    collections:
      - kind: minor
        trigger: "program request"
        roots: 1
        min: 1
        max: 1

  - name: module-generic-field
    fixture: tests/fixtures/module_generic_field
    expect:
