      - "--config=mono_all"
    expect:
      stdout: "7\n"
    carriers: []

  - name: module-generic-nested-edge
    fixture: tests/fixtures/module_generic_nested
    compile_args:
      - "--config=mono_edge"
    expect:
      stdout: "7\n"
    carriers: []

  - name: module-generic-fold
    fixture: tests/fixtures/module_generic_fold
    expect:
      stdout: "40\n"
    carriers: []

  - name: module-generic-fold-mono
