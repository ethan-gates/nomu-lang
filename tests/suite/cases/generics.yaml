# Cases: generic module code: erased and monomorphized generics across modules, their mangling.

cases:
  - name: gc-generic-two-consumers-evac
    fixture: tests/fixtures/gc_generic_two_consumers
    compile_settings:
      escape: false
    compile_args:
      - "--config=mono_all"
    run_settings:
      gc_stress_bytes: 4096
    expect:
      stdout: "26\n"
    carriers:
      - 1
      - 2
    collections:
      - min: 1

  - name: module-generic-type
    fixture: tests/fixtures/module_generic_type
    expect:
      stdout: "427\n"
    carriers: []

  - name: module-generic-method
    fixture: tests/fixtures/module_generic_method
    expect:
      stdout: "7\n1\n"
    carriers: []

  - name: module-generic-mut-method
    fixture: tests/fixtures/module_generic_mut_method
    expect:
      stdout: "7\n42\n3\n99\n"
    carriers: []

  - name: module-generic-fn
    fixture: tests/fixtures/module_generic_fn
    expect:
      stdout: "42\n"
    carriers: []

  - name: module-generic-fn-mono
    fixture: tests/fixtures/module_generic_fn
    compile_args:
      - "--config=mono_all"
    expect:
      stdout: "42\n"
    carriers: []

  - name: module-generic-nested
    fixture: tests/fixtures/module_generic_nested
    expect:
      stdout: "7\n"
    carriers: []

  - name: module-generic-nested-mono
    fixture: tests/fixtures/module_generic_nested
    compile_args:
      - "--config=mono_all"
    expect:
      stdout: "7\n"
    carriers: []

  - name: module-generic-nested-edge
    fixture: tests/fixtures/module_generic_nested
    compile_args:
      - "--config=mono_edge"
    expect:
      stdout: "7\n"
    carriers: []

  - name: module-generic-fold
    fixture: tests/fixtures/module_generic_fold
    expect:
