    expect:
      stdout: "726\n"
    carriers: []

  - name: module-generic-privcallee
    fixture: tests/fixtures/module_generic_privcallee
    expect:
      stdout: "40\n"
    carriers: []

  - name: module-generic-privcallee-mono
