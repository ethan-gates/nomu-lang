# Cases: the scheduler: fibers, carriers, timers, the poller, actors, futexes, line input.

cases:
  - name: read-line
    fixture: tests/fixtures/read_line
    compile_settings:
      rt_prelude: true
    stdin_file: tests/input/read_line.txt
    stdin_after: "ready\n"
    expect:
      stdout: "tick\ntick\ntick\ngot 'first' 5\ngot 'second' 6\ngot 'tail' 4\ngot '' 0\n3\n"
    carriers:
      - 1
      - 4

  - name: read-line-readers
    fixture: tests/fixtures/read_line_readers
    compile_settings:
      rt_prelude: true
    stdin_file: tests/input/read_line_readers.txt
    stdin_after: "ready\n"
    expect:
      stdout: "7\n"
    carriers:
      - 1
      - 2
      - 4
    iterations: 3

  - name: read-line-gc
    fixture: tests/fixtures/read_line_gc
    compile_settings:
      escape: false
      rt_prelude: true
    stdin_file: tests/input/read_line_gc.txt
    stdin_after: "ready\n"
    run_settings:
      gc_stress_bytes: 256
    expect:
      stdout: "4242 held string late 179994\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  - name: read-line-long
    fixture: tests/fixtures/read_line_long
    compile_settings:
      escape: false
    stdin_file: tests/input/read_line_long.txt
    run_settings:
      gc_stress_bytes: 256
    expect:
      stdout: "15 fifteen bytes!!\n16 sixteen bytes!!!\n38 this line is longer than fifteen bytes\n10000 97 122\n20 unterminated tail 20\n0 \n179994\n"
    carriers:
      - 1
      - 4
    collections:
      - min: 1

  - name: fiber-registry
    fixture: tests/fixtures/fiber_registry
    compile_args:
      - "--runtime-subset=regInsert,regRemove,regCount,regSum"
    expect:
      stdout: "5 15\n4 12\n3 7\n2 6\n"
    carriers: []

  - name: fiberswitch
    fixture: tests/fixtures/fiberswitch
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "42\n"
    carriers: []

  - name: scheduler
    fixture: tests/fixtures/scheduler
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=enqueue,dequeue,schedRun,fiberMain,fiberStart,park,unpark,joinFiber"
    expect:
      stdout: "6\n111\n42\n"
    carriers: []

  - name: scheduler-lock
    fixture: tests/fixtures/scheduler_lock
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,schedRun,fiberMain,fiberNew,fiberStart,fiberStartParked,park,parkLocked,unpark,unparkLocked,joinFiber"
    expect:
      stdout: "6\n111\n42\n2000\n"
    carriers: []

  - name: scheduler-mc
    fixture: tests/fixtures/scheduler_mc
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,wakeCarrier,fiberNew,fiberStart,fiberMain,schedLoop,carrierMain"
    expect:
      stdout: "600\n"
    carriers: []
    iterations: 30
    weight: 3

  - name: scheduler-poller
    fixture: tests/fixtures/scheduler_poller
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,wakeCarrier,signalStop,fiberNew,fiberStart,unpark,waitReadable,fiberMain,schedLoop,carrierMain,pollerMain"
    expect:
      stdout: "36\n"
    carriers: []
    iterations: 30
    weight: 3

  - name: scheduler-timer
    fixture: tests/fixtures/scheduler_timer
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,wakeCarrier,wakeTimer,signalStop,heapSwap,timerPush,timerPopMin,fiberNew,fiberStart,unpark,fiberSleep,fiberMain,schedLoop,carrierMain,timerMain"
    expect:
      stdout: "1\n2\n3\n4\n"
    carriers: []
    iterations: 8
    weight: 3

  - name: scheduler-tls
    fixture: tests/fixtures/scheduler_tls
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,wakeCarrier,fiberNew,handOff,unpark,fiberMain,schedLoop,carrierMain,ringBody"
    expect:
      stdout: "2000\n"
    carriers: []
    iterations: 40
    weight: 3

  - name: scheduler-actor
    fixture: tests/fixtures/scheduler_actor
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=mutexLock,mutexUnlock,enqueue,dequeue,wakeCarrier,signalStop,schedMbPush,schedMbPop,mailboxFiberNew,mailboxDispatch,actorSend,mailboxPop,mailboxDrain,mailboxFiberMain,schedLoop,carrierMain"
    expect:
      stdout: "400\n0\n"
    carriers: []
    iterations: 40
    weight: 3

  - name: futex
    fixture: tests/fixtures/futex
    compile_settings:
      runtime_tier: true
    expect:
      stdout: "111\n"
    carriers: []

  - name: futex-subset
    fixture: tests/fixtures/futex
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=futexProbe"
    expect:
      stdout: "111\n"
    carriers: []

  - name: pingpong
    fixture: tests/fixtures/pingpong
    compile_settings:
      runtime_tier: true
    compile_args:
      - "--runtime-subset=worker"
    expect:
      stdout: "111\n"
    carriers: []
    iterations: 10
    weight: 2

  # Ready work stranded behind running fibers (task 235.9): a searcher that steals part of a queue wakes
  # another for the rest. Before the fix the late fiber waited for the idle timeout, and the busy fibers gave
  # up at 400 ms.
  - name: stranded-spawn
    fixture: tests/fixtures/stranded_spawn
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "0\n"
    carriers:
      - 2
      - 3
      - 4
      - 8
    iterations: 10

  # Preemption (task 236.5): spinners in a call-free loop and in loop-free recursion hold every carrier; the
  # fiber that ends them runs only if the monitor takes a carrier back. Without preemption it never ends.
  - name: preempt-spin
    fixture: tests/fixtures/preempt_spin
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "done 2\n"
    carriers:
      - 1
      - 2
    iterations: 5
    timeout_sec: 20

  # The deferred wake: a readying into the slot owes its wake, a park drops it, and a readier that
  # keeps running pays it at its next stop. With preemption off, only the paid wake gets the receiver of the
  # `spin` shape run, so a lost wake hangs the run; on one carrier that shape needs preemption.
  - name: deferred-wake
    fixture: tests/fixtures/deferred_wake
    expect:
      stdout: "pingpong 10000 spin 200 task 1000\n"
    carriers:
      - 1
      - 2
      - 4
      - 8
    iterations: 3
    timeout_sec: 30

  - name: deferred-wake-no-preempt
    fixture: tests/fixtures/deferred_wake
    run_settings:
      preempt: "0"
    expect:
      stdout: "pingpong 10000 spin 200 task 1000\n"
    carriers:
      - 2
      - 4
      - 8
    iterations: 5
    timeout_sec: 30

  # The direct switch: handoff chains under back-to-back collections, steals of the slot, and stack
  # moves of a fiber just switched in. Each hop's value and the message it answers are checked.
  - name: handoff-stress
    fixture: tests/fixtures/handoff_stress
    compile_settings:
      rt_prelude: true
    expect:
      stdout: "40000 collected\n"
    carriers:
      - 1
      - 2
      - 4
      - 8
    iterations: 3
    timeout_sec: 60
    collections:
      - kind: minor
        trigger: "program request"
        min: 1

  - name: handoff-stress-no-preempt
    fixture: tests/fixtures/handoff_stress
    compile_settings:
      rt_prelude: true
    run_settings:
      preempt: "0"
    expect:
      stdout: "40000 collected\n"
    carriers:
      - 2
      - 4
      - 8
    iterations: 3
    timeout_sec: 60

  # A chain of handoffs is one run: on one carrier the monitor ends it once it holds the carrier past
  # its slice while a compute fiber waits. Without that the pair hands off forever and the run times out.
  - name: handoff-fair
    fixture: tests/fixtures/handoff_fair
    expect:
      stdout: "fair\n"
    carriers:
      - 1
      - 2
    iterations: 3
    timeout_sec: 20
