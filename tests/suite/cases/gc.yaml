  - name: gc-record-full
    fixture: tests/fixtures/gc_record_full
    compile_settings:
      gc_record_full: true
    run_settings:
      nursery_blocks: 4
    expect:
      stdout: "199999 200\n"
    carriers:
      - 1
      - 4
    collections:
      - kind: minor
        min: 10
    report_metrics:
      - path: allocation.objects
        equals: 200009
      - path: allocation.bytes
        equals: 3204216
      - path: promotion.objects
        min: 100
        max: 400
      - path: allocation.minorSurvival
        min: 0.001
        max: 0.01

