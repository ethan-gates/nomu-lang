# The integration suite's manifest (task 155): the defaults, the dimensions and the groups. The cases are in
# cases/<area>.yaml; the harness loads every file there. Schema and settings: tests/README.md.

defaults:
  timeout_sec: 60
  compile_timeout_sec: 120
  iterations: 1
  carriers:
    - 1
  heavy: false

dimensions:
  pipeline:
    - name: debug
    - name: release
      compile_settings:
        optimize: true
      tier: full
    - name: noinline
      compile_settings:
        inline: false
      tier: full
  gc:
    - name: default
    - name: nursery
      run_settings:
        nursery_blocks: 64
      collections:
        - min: 1
    - name: nursery-tight
      run_settings:
        nursery_blocks: 1
      collections:
        - min: 1
    - name: stress-minor
      run_settings:
        gc_stress_bytes: 4096
      collections:
        - min: 100
    - name: immix-stress
      compile_settings:
        gc_immix: true
      run_settings:
        gc_stress_bytes: 4096
      collections:
        - kind: major
          min: 100
        - kind: minor
          max: 0
      tier: full
    - name: stress-minor-verify
      run_settings:
        gc_stress_bytes: 4096
        gc_verify: 1
      collections:
        - min: 100
      tier: full
    - name: stress-major
      run_settings:
        gc_stress_bytes: 4096
        mature_floor: 8192
      collections:
        - min: 100
      tier: full
    # Minors and majors alternating: stress collections, every fourth a major, so minors run after majors
    # whatever the program's live data. Minors that follow a major were otherwise untested (task 159.7). The
    # heap verifier checks every collection (task 159.8).
    - name: stress-mixed
      run_settings:
        gc_stress_bytes: 4096
        stress_major_every: 4
        gc_verify: 1
      collections:
        - kind: minor
          min: 10
        - kind: major
          min: 2
      tier: full

groups:
  - name: shape
    fixtures: tests/fixtures/shape_matrix/*
    across:
      - pipeline
      - gc
    compile_settings:
      escape: false
    expect:
      stdout: "bad 0\n"
  - name: stack-move
    fixtures: tests/fixtures/stack_move_matrix/*
    across:
      - pipeline
      - gc
    compile_settings:
      escape: false
    run_settings:
      stack_move: 1
    expect:
      stdout: "bad 0\n"
  - name: stack-move-checks
    fixtures: tests/fixtures/stack_move_matrix/*
    across:
      - pipeline
      - gc
    compile_settings:
      escape: false
    run_settings:
      stack_move_checks: 1
    expect:
      stdout: "bad 0\n"
  # References held in value types (structs and enums holding class objects), with escape analysis on:
  # placement, and the write barrier for stores into mature objects (task 260).
  - name: value-refs
    fixtures: tests/fixtures/value_ref_matrix/*
    across:
      - pipeline
      - gc
    expect:
      stdout: "bad 0\n"
  # Enum layouts: a tag only, over a payload's extra inhabitants, an appended tag; generic enums across the
  # erased boundary; recursive enums, boxed.
  - name: enum-layouts
    fixtures: tests/fixtures/enum_layout_matrix/*
    across:
      - pipeline
      - gc
    expect:
      stdout: "bad 0\n"
  - name: layout
    fixtures: tests/fixtures/layout_matrix/*
    across:
      - pipeline
    compile_settings:
      escape: false
  # The user-facing demos in examples/, each checked against the expected.txt beside it.
  - name: examples
    fixtures: examples/*
    # generics: task 232 (a String property read through a generic bound fails LLVM verification).
    # table: an empty main.nomu.
    exclude:
      - generics
      - table
    across: []
