# Configs the integration suite and the tools select (tests/suite, tools/). Each sets one setting, so
# they combine: `-c release -c no_escape`.
configs:
  mono_all: null
  mono_edge: null
  no_devirt: null
  no_inline: null
  no_escape: null
  no_scalar: null
  rt_prelude: null
  runtime_tier: null
  gc_record: null
  gc_record_full: null
  gc_immix: null
  measure_no_statepoints: null
  measure_no_shaped_homes: null
  measure_no_loop_polls: null
  measure_gc_regs: null
  measure_no_frame_split: null
  measure_no_stack_checks: null
  measure_libc_direct: null
opt:
  mono mono_all: all
  mono mono_edge: edge
  devirt no_devirt: false
  inline no_inline: false
  escape no_escape: false
  scalar no_scalar: false
test rt_prelude:
  runtime_prelude: true
test runtime_tier:
  runtime_tier: true
gc gc_record:
  record: limited
gc gc_record_full:
  record: full
gc gc_immix:
  plan: immix
# Measurement only (task 243.1): unsound while anything collects.
measure measure_no_statepoints:
  no_statepoints: true
measure measure_no_shaped_homes:
  no_shaped_homes: true
measure measure_no_loop_polls:
  no_loop_polls: true
measure measure_gc_regs:
  gc_value_regs: "8"
measure measure_no_frame_split:
  no_frame_split: true
measure measure_no_stack_checks:
  no_stack_checks: true
measure measure_libc_direct:
  libc_direct: true
